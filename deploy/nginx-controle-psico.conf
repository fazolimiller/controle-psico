# /etc/nginx/sites-available/controle-psico  (proxy reverso com HTTPS)
# Ajuste server_name e os caminhos do certificado emitido pela TI.

server {
    listen 80;
    server_name psico.santacasasjc.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name psico.santacasasjc.com.br;

    ssl_certificate     /etc/ssl/certs/psico.crt;
    ssl_certificate_key /etc/ssl/private/psico.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;
    server_tokens off;

    # Opcional: restringir à rede interna do hospital
    # allow 10.0.0.0/8;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
